<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Form</title>
</head>
<body>

<h1>University Registration Form</h1>
<p>Please fill out the form</p>
<hr>

<form>

<h2>Personal Details</h2>

<label>First Name:</label>
<input type="text" name="first_name" placeholder="Arjun"><br><br>

<label>Last Name:</label>
<input type="text" name="last_name" placeholder="Sharma"><br><br>

<label>Date of Birth:</label>
<input type="date" name="dob"><br><br>

<h3>Gender</h3>

<input type="radio" name="gender" value="male"> Male<br>
<input type="radio" name="gender" value="female"> Female<br>
<input type="radio" name="gender" value="other"> Other<br><br>

<label>Upload Photo:</label><br>
<input type="file" name="photo"><br><br>

<hr>

<h2>Contact Information</h2>

<label>Email:</label>
<input type="email" name="email"><br><br>

<label>Phone:</label>
<input type="tel" name="phone"><br><br>

<label>Address:</label><br>
<textarea name="address" rows="4" cols="30"></textarea><br><br>

<hr>

<h2>Academic Information</h2>

<label>Select Course:</label>

<select name="course">
    <option value="cse">CSE</option>
    <option value="me">Mechanical</option>
    <option value="ce">Civil</option>
</select><br><br>

<h3>Subjects</h3>

<input type="checkbox" name="subject" value="python"> Python<br>
<input type="checkbox" name="subject" value="js"> JavaScript<br>

<br>
<input type="submit">

</form>

</body>
</html>
