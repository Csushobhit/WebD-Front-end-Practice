<!DOCTYPE html>
<html>
<head>
    <title>Ordered List</title>
</head>
<body>

<h2>Simple Ordered List</h2>
<ol>
    <li>Milk</li>
    <li>Sugar</li>
    <li>Tea Leaves</li>
    <li>Water</li>
</ol>

<h2>Nested Ordered List</h2>
<ol>
    <li>Frontend
        <ol>
            <li>HTML</li>
            <li>CSS</li>
        </ol>
    </li>
    <li>Backend</li>
</ol>

</body>
</html>
