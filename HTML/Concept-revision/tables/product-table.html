<!DOCTYPE html>
<html>
<head>
    <title>Product Table</title>
</head>
<body>

<table border="1">
    <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>

    <tr>
        <td>Apple</td>
        <td>10</td>
        <td>$1</td>
    </tr>

    <tr>
        <td>Orange</td>
        <td>5</td>
        <td>$0.5</td>
    </tr>
</table>

</body>
</html>
