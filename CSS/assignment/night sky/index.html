<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Sky with Stars</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0033, #000);
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* STARS */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.7);
        }

        @keyframes twinkle {
            0%,100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.2); }
        }

        @keyframes drift {
            0% { transform: translate(0,0); }
            50% { transform: translate(20px,-30px); }
            100% { transform: translate(0,0); }
        }

        /* METEOR */
        .meteor {
            position: absolute;
            width: 2px;
            height: 120px;
            background: linear-gradient(
                rgba(255,255,255,1),
                rgba(255,255,255,0.5),
                transparent
            );
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes meteorFall {
            0% {
                opacity: 0;
                transform: translate(0,0) rotate(var(--angle));
            }
            10% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) rotate(var(--angle));
            }
        }
    </style>
</head>

<body>

<div class="particles" id="particles"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const container = document.getElementById('particles');

    /* ---------- STARS ---------- */
    for (let i = 0; i < 150; i++) {
        const star = document.createElement('div');
        star.classList.add('star');

        const size = Math.random() * 5 + 2;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;

        star.style.left = `${Math.random() * window.innerWidth}px`;
        star.style.top = `${Math.random() * window.innerHeight}px`;

        star.style.opacity = Math.random() * 0.5 + 0.3;

        const delay = Math.random() * 4;
        const twinkleDuration = Math.random() * 5 + 3;

        star.style.animation = `
            twinkle ${twinkleDuration}s ease-in-out ${delay}s infinite,
            drift 15s linear infinite
        `;

        container.appendChild(star);
    }

    /* ---------- METEOR ---------- */
    function createMeteor() {
        const meteor = document.createElement('div');
        meteor.classList.add('meteor');

        // START POSITION (top band, not random screen)
        const startX = Math.random() * window.innerWidth * 0.9;
        const startY = -100;

        meteor.style.left = `${startX}px`;
        meteor.style.top = `${startY}px`;

        // RANDOM ANGLE
        const angle = 35 + Math.random() * 20;
        meteor.style.setProperty('--angle', angle + 'deg');

        // RANDOM DISTANCE
        const dx = -600 - Math.random() * 400;
        const dy = 600 + Math.random() * 400;
        meteor.style.setProperty('--dx', dx + 'px');
        meteor.style.setProperty('--dy', dy + 'px');

        // RANDOM SPEED
        const duration = Math.random() * 1 + 1.2;

        meteor.style.animation = `meteorFall ${duration}s linear forwards`;

        container.appendChild(meteor);

        setTimeout(() => meteor.remove(), duration * 1000);
    }

    /* ---------- BURST SYSTEM (IMPORTANT FIX) ---------- */
    function meteorShowerBurst() {
        const count = Math.floor(Math.random() * 3) + 2; // 2–4 meteors

        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                createMeteor();
            }, i * 150);
        }
    }

    function scheduleNextShower() {
        const delay = Math.random() * 4000 + 2000; // 2–6 sec

        setTimeout(() => {
            meteorShowerBurst();
            scheduleNextShower();
        }, delay);
    }

    scheduleNextShower();
});
</script>

</body>
</html>
