<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model & Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Hello Coder Army</h1>
    <h2>Strike is Coming Soon</h2>

    <p>
        This is a normal paragraph.
        <span>This part is styled using span</span>
        and shows inline behavior.
    </p>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>

    <span class="inline-box">Inline Box 1</span>
    <span class="inline-box">Inline Box 2</span>

</body>
</html>
